services:
  minecraft:
    # Sem "args": a versao do Paper vive so nos ARGs do Dockerfile.
    # Passar parte deles aqui ja causou build quebrado (o SHA compoe
    # a URL de download, entao bumpar o build sozinho dava 404).
    build: .
    image: my-minecraft-server
    container_name: minecraft
    restart: unless-stopped

    # Mantem o console do Paper vivo para "docker attach minecraft"
    stdin_open: true
    tty: true

    ports:
      - "${SERVER_PORT:-25565}:25565"

    environment:
      MEMORY: "${MEMORY:-6G}"
      EULA: "${EULA:-false}"

    volumes:
      - ./data:/data
      # Repositorio montado somente-leitura. E o que faz "git pull +
      # restart" bastar: sem ele, o entrypoint leria a config embutida na
      # imagem e cada ajuste exigiria rebuild.
      - ./:/opt/repo:ro

    # O Paper precisa de tempo para salvar os chunks no SIGTERM.
    # Matar antes disso corrompe o mundo.
    stop_grace_period: 2m

    # Heap + overhead da JVM (metaspace, threads, buffers off-heap).
    # Sempre acima do MEMORY, senao o kernel mata o container.
    mem_limit: "${MEMORY_LIMIT:-8G}"
